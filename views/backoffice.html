<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Back Office</title>
  <style>
    body {
      background-color: #fffacd; /* Pale yellow background */
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    h1, h2, h3 {
      color: #333;
    }
    a {
      color: #ffeb8a; /* Pale yellow link */
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    form {
      margin-bottom: 15px;
    }
    input[type="file"], input[type="email"], input[type="password"], select, textarea {
      padding: 8px;
      margin-right: 10px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-family: inherit;
      font-size: 14px;
    }
    button {
      background-color: #f9f4b2; /* Pale yellow button */
      border: none;
      color: #333;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #e6e1a1;
    }
    #user-list ul, #photo-list ul {
      list-style-type: none;
      padding-left: 0;
    }
    #user-list li, #photo-list li {
      padding: 4px 0;
    }
    #paste-area {
      width: 100%;
      height: 100px;
      resize: vertical;
      margin-top: 8px;
    }
    #paste-upload-btn {
      margin-top: 10px;
    }
    #paste-upload-status {
      margin-top: 8px;
      font-style: italic;
      color: green;
    }
    #caroManuTextEditor {
      width: 100%;
      height: 80px;
      resize: vertical;
      font-family: inherit;
      font-size: 16px;
      margin-bottom: 10px;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    #caroManuSaveBtn {
      padding: 8px 16px;
      font-size: 16px;
      cursor: pointer;
      background-color: #f9f4b2;
      color: #333;
      border: none;
      border-radius: 5px;
    }
    #caroManuSaveBtn:hover {
      background-color: #e6e1a1;
    }
    #caroManuSaveStatus {
      margin-top: 8px;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h1>Back Office</h1>
  <p><a href="/gallery">View Gallery</a> | <a href="/logout">Logout</a></p>

  <h2>Edit Front Page Text</h2>
  <textarea id="caroManuTextEditor" placeholder="Enter front page text here..."></textarea><br />
  <button id="caroManuSaveBtn">Save Text</button>
  <div id="caroManuSaveStatus"></div>

  <h2>Upload Photo</h2>
  <form action="/upload-photo" method="post" enctype="multipart/form-data">
    <input type="file" name="photo" accept="image/*" required>
    <button type="submit">Upload</button>
  </form>

  <h2>Remove Photo</h2>
  <form id="remove-photo-form" action="/remove-photo" method="post">
    <select name="filename" id="photo-select" required>
      <option value="">Select a photo to remove</option>
    </select>
    <button type="submit">Remove</button>
  </form>

  <h2>Change Password</h2>
  <form id="changePasswordForm">
    <input type="password" id="newPassword" placeholder="Enter new password" required>
    <button type="submit">Change Password</button>
    <div id="changePasswordStatus"></div>
  </form>

  <h2>Copy & Paste Image Upload</h2>
  <p>Paste an image from your clipboard below and click Upload.</p>
  <textarea id="paste-area" placeholder="Paste image here"></textarea><br />
  <button id="paste-upload-btn">Upload Pasted Image</button>
  <div id="paste-upload-status"></div>

  <h2>Manage Authorized Users</h2>
  <h3>Add User</h3>
  <form action="/add-user" method="post">
    <input type="email" name="email" placeholder="Email" required>
    <button type="submit">Add</button>
  </form>

  <h3>Remove User</h3>
  <form action="/remove-user" method="post">
    <input type="email" name="email" placeholder="Email" required>
    <button type="submit">Remove</button>
  </form>

  <h2>Authorized Users List</h2>
  <div id="user-list"></div>

  <script>
    // Load current CARO_MANU_TEXT environment variable and fill textarea
    async function loadCaroManuText() {
      try {
        const response = await fetch('/api/env?key=CARO_MANU_TEXT');
        if (!response.ok) {
          throw new Error('Failed to fetch text');
        }
        const data = await response.json();
        document.getElementById('caroManuTextEditor').value = data.value || 'Le site de Caro & Manu';
      } catch (err) {
        console.error(err);
      }
    }

    // Save edited CARO_MANU_TEXT environment variable
    document.getElementById('caroManuSaveBtn').addEventListener('click', async () => {
      const text = document.getElementById('caroManuTextEditor').value.trim();
      const statusDiv = document.getElementById('caroManuSaveStatus');
      statusDiv.textContent = 'Saving...';
      try {
        const response = await fetch('/api/env', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key: 'CARO_MANU_TEXT', value: text })
        });
        if (!response.ok) {
          throw new Error('Failed to save text');
        }
        statusDiv.style.color = 'green';
        statusDiv.textContent = 'Text saved successfully!';
      } catch (err) {
        statusDiv.style.color = 'red';
        statusDiv.textContent = 'Failed to save text.';
        console.error(err);
      }
    });

    // Existing code for users and photos dropdown population
    fetch('/api/users')
      .then(response => response.json())
      .then(data => {
        const listDiv = document.getElementById('user-list');
        if (data.emails.length === 0) {
          listDiv.textContent = 'No authorized users yet.';
        } else {
          const ul = document.createElement('ul');
          data.emails.forEach(email => {
            const li = document.createElement('li');
            li.textContent = email;
            ul.appendChild(li);
          });
          listDiv.appendChild(ul);
        }
      });

    fetch('/api/photos')
      .then(response => response.json())
      .then(data => {
        const select = document.getElementById('photo-select');
        if (data.photos.length === 0) {
          const option = document.createElement('option');
          option.value = '';
          option.textContent = 'No photos available';
          select.appendChild(option);
          select.disabled = true;
        } else {
          data.photos.forEach(photo => {
            const option = document.createElement('option');
            option.value = photo.filename;
            option.textContent = photo.filename;
            select.appendChild(option);
          });
          select.disabled = false;
        }
      });

    // Online/Offline popup alerts
    window.addEventListener('online', () => {
      alert('You are online');
    });
    window.addEventListener('offline', () => {
      alert('You are offline');
    });
  </script>
</body>
</html>
