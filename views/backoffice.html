<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Back Office</title>
  <style>
    body {
      background-color: #87CEEB;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    h1, h2, h3 {
      color: #333;
    }
    a {
      color: #007bff;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    form {
      margin-bottom: 15px;
    }
    input[type="file"], input[type="email"], select {
      padding: 8px;
      margin-right: 10px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #4CAF50;
      border: none;
      color: white;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    #user-list ul, #photo-list ul {
      list-style-type: none;
      padding-left: 0;
    }
    #user-list li, #photo-list li {
      padding: 4px 0;
    }
  </style>
</head>
<body>
  <h1>Back Office</h1>
  <p><a href="/gallery">View Gallery</a> | <a href="/logout">Logout</a></p>
  
  <h2>Upload Photo</h2>
  <form action="/upload-photo" method="post" enctype="multipart/form-data">
    <input type="file" name="photo" accept="image/*" required>
    <button type="submit">Upload</button>
  </form>

  <h2>Remove Photo</h2>
  <form id="remove-photo-form" action="/remove-photo" method="post">
    <select name="filename" id="photo-select" required>
      <option value="">Select a photo to remove</option>
    </select>
    <button type="submit">Remove</button>
  </form>

  <h2>Manage Authorized Users</h2>
  <h3>Add User</h3>
  <form action="/add-user" method="post">
    <input type="email" name="email" placeholder="Email" required>
    <button type="submit">Add</button>
  </form>
  
  <h3>Remove User</h3>
  <form action="/remove-user" method="post">
    <input type="email" name="email" placeholder="Email" required>
    <button type="submit">Remove</button>
  </form>

  <h2>Authorized Users List</h2>
  <div id="user-list"></div>

  <script>
    // Fetch and display authorized users list
    fetch('/api/users')
      .then(response => response.json())
      .then(data => {
        const listDiv = document.getElementById('user-list');
        if (data.emails.length === 0) {
          listDiv.textContent = 'No authorized users yet.';
        } else {
          const ul = document.createElement('ul');
          data.emails.forEach(email => {
            const li = document.createElement('li');
            li.textContent = email;
            ul.appendChild(li);
          });
          listDiv.appendChild(ul);
        }
      });

    // Fetch and populate photo removal dropdown
    fetch('/api/photos')
      .then(response => response.json())
      .then(data => {
        const select = document.getElementById('photo-select');
        if (data.photos.length === 0) {
          const option = document.createElement('option');
          option.value = '';
          option.textContent = 'No photos available';
          select.appendChild(option);
          select.disabled = true;
        } else {
          data.photos.forEach(photo => {
            const option = document.createElement('option');
            option.value = photo.filename;
            option.textContent = photo.filename;
            select.appendChild(option);
          });
          select.disabled = false;
        }
      });
  </script>
</body>
</html>
