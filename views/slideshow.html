<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Slideshow</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 40px;
    }
    h1 {
      color: #333;
    }
    .slideshow-container {
      position: relative;
      width: 80%;
      max-width: 700px;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    img {
      max-width: 100%;
      border-radius: 8px;
      height: auto;
    }
    .caption {
      margin-top: 10px;
      font-weight: bold;
      color: #555;
    }
    .nav-buttons {
      margin-top: 15px;
    }
    button {
      background-color: #4CAF50;
      border: none;
      color: white;
      padding: 10px 15px;
      margin: 0 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <h1>Photo Slideshow</h1>
  <div class="slideshow-container">
    <img id="slideImage" src="" alt="Photo" />
    <div class="caption" id="caption"></div>
    <div class="nav-buttons">
      <button id="prevBtn">Previous</button>
      <button id="nextBtn">Next</button>
    </div>
  </div>

  <script>
    let photos = [];
    let currentIndex = 0;
    const slideImage = document.getElementById('slideImage');
    const caption = document.getElementById('caption');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    async function loadPhotos() {
      try {
        const response = await fetch('/api/photos');
        if (!response.ok) {
          throw new Error('Failed to fetch photos');
        }
        const data = await response.json();
        photos = data.photos;
        if (photos.length === 0) {
          caption.textContent = 'No photos to show';
          slideImage.style.display = 'none';
          prevBtn.disabled = true;
          nextBtn.disabled = true;
          return;
        }
        showSlide(currentIndex);
      } catch (err) {
        caption.textContent = 'Error loading photos.';
        console.error(err);
      }
    }

    function showSlide(index) {
      if (index < 0) {
        currentIndex = photos.length - 1;
      } else if (index >= photos.length) {
        currentIndex = 0;
      } else {
        currentIndex = index;
      }
      slideImage.src = photos[currentIndex].url;
      slideImage.alt = photos[currentIndex].filename;
      caption.textContent = photos[currentIndex].filename;
    }

    prevBtn.addEventListener('click', () => {
      showSlide(currentIndex - 1);
    });

    nextBtn.addEventListener('click', () => {
      showSlide(currentIndex + 1);
    });

    window.onload = loadPhotos;
  </script>
</body>
</html>
