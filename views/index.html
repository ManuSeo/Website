<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Caro & Manu</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 40px;
  }
  #wordmap {
    width: 600px;
    height: 400px;
    margin: 0 auto 20px;
    background: url('https://upload.wikimedia.org/wikipedia/commons/thumb/f/f1/Wordcloud.png/600px-Wordcloud.png') no-repeat center center;
    background-size: contain;
  }
  a {
    margin: 0 10px;
  }
  .scroller-container {
    position: relative;
    width: 80%;
    margin: 30px auto;
  }
  .scroller {
    overflow-x: auto;
    white-space: nowrap;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
    scroll-behavior: smooth;
  }
  .photo-item {
    display: inline-block;
    background: white;
    border: 1px solid #ccc;
    border-radius: 5px;
    width: 200px;
    margin-right: 10px;
    padding: 10px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    text-align: center;
    vertical-align: top;
  }
  .photo-item img {
    max-width: 100%;
    height: auto;
    border-radius: 3px;
  }
  .download-link {
    display: block;
    margin-top: 10px;
    padding: 5px 10px;
    background-color: #4CAF50;
    color: white;
    text-decoration: none;
    border-radius: 3px;
  }
  .download-link:hover {
    background-color: #45a049;
  }
  .scroll-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background-color: rgba(0,0,0,0.5);
    color: white;
    border: none;
    padding: 10px 15px;
    cursor: pointer;
    border-radius: 3px;
    z-index: 10;
    user-select: none;
  }
  .scroll-btn:hover {
    background-color: rgba(0,0,0,0.7);
  }
  #scrollLeft {
    left: -50px;
  }
  #scrollRight {
    right: -50px;
  }
  #uploadForm {
    margin: 20px auto;
    width: 80%;
    text-align: center;
  }
  #uploadInput {
    margin-right: 10px;
  }
  #uploadButton {
    padding: 6px 12px;
    font-size: 14px;
    cursor: pointer;
  }
  #uploadStatus {
    margin-top: 10px;
    font-style: italic;
    color: green;
  }
</style>
</head>
<body>
  <h1>Welcome to the Photo Gallery Website</h1>
  <div id="wordmap"></div>
  <p>This is a public welcome page visible to everyone.</p>
  <p>
    <a href="/login">Login</a> | 
    <a href="/gallery">View Gallery (login required)</a> | 
    <a href="/backoffice">Back Office (login required)</a>
  </p>

  <h2>Public Photo Gallery</h2>

  <form id="uploadForm">
    <input type="file" id="uploadInput" name="photos" multiple accept="image/*" />
    <button type="submit" id="uploadButton">Upload Photos</button>
    <div id="uploadStatus"></div>
  </form>

  <div class="scroller-container">
    <button id="scrollLeft" class="scroll-btn" aria-label="Scroll Left">&#9664;</button>
    <div class="scroller" id="photoScroller">
      <!-- Photos will be dynamically loaded here -->
    </div>
    <button id="scrollRight" class="scroll-btn" aria-label="Scroll Right">&#9654;</button>
  </div>

  <script>
    async function loadPhotos() {
      try {
        const response = await fetch('/api/photos');
        if (!response.ok) {
          throw new Error('Failed to fetch photos');
        }
        const data = await response.json();
        const photoScroller = document.getElementById('photoScroller');
        if (data.photos.length === 0) {
          photoScroller.innerHTML = '<p>No photos available.</p>';
          return;
        }
        photoScroller.innerHTML = '';
        data.photos.forEach(photo => {
          const div = document.createElement('div');
          div.className = 'photo-item';

          const img = document.createElement('img');
          img.src = photo.url;
          img.alt = photo.filename;
          img.title = photo.filename;

          const link = document.createElement('a');
          link.href = photo.url;
          link.download = photo.filename;
          link.className = 'download-link';
          link.textContent = 'Download';

          div.appendChild(img);
          div.appendChild(link);
          photoScroller.appendChild(div);
        });
      } catch (err) {
        document.getElementById('photoScroller').innerHTML = '<p>Error loading photos.</p>';
        console.error(err);
      }
    }

    async function uploadPhotos(files) {
      const statusDiv = document.getElementById('uploadStatus');
      statusDiv.textContent = 'Uploading...';
      const formData = new FormData();
      for (const file of files) {
        formData.append('photos', file);
      }
      try {
        const response = await fetch('/api/upload', {
          method: 'POST',
          body: formData
        });
        if (!response.ok) {
          throw new Error('Upload failed');
        }
        statusDiv.textContent = 'Upload successful!';
        loadPhotos();
      } catch (err) {
        statusDiv.textContent = 'Upload failed. Try again.';
        console.error(err);
      }
    }

    document.getElementById('uploadForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const files = document.getElementById('uploadInput').files;
      if (files.length === 0) {
        alert('Please select at least one photo to upload.');
        return;
      }
      uploadPhotos(files);
    });

    function scrollScroller(amount) {
      const scroller = document.getElementById('photoScroller');
      scroller.scrollBy({ left: amount, behavior: 'smooth' });
    }

    document.getElementById('scrollLeft').addEventListener('click', () => scrollScroller(-220));
    document.getElementById('scrollRight').addEventListener('click', () => scrollScroller(220));

    window.onload = loadPhotos;
  </script>
</body>
</html>
