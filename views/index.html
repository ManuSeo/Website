<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Caro & Manu</title>
<style>
  body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background-color: #f5f5dc; /* Changed to beige background */
    margin: 20px;
    color: #222;
    text-align: center;
  }
  a {
    color: #0073e6;
    text-decoration: none;
  }
  a:hover {
    text-decoration: underline;
  }
  #caroManuBox {
    margin: 20px auto;
    padding: 15px;
    border: 2px solid #0073e6;
    border-radius: 8px;
    max-width: 600px;
    font-size: 24px;
    font-weight: 600;
    color: #0073e6;
  }
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 15px;
    max-width: 1100px;
    margin: 0 auto;
    padding: 10px;
  }
  .photo-item {
    background-color: white;
    border-radius: 4px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    overflow: hidden;
    position: relative;
    cursor: pointer;
    transition: box-shadow 0.3s ease;
  }
  .photo-item:hover {
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  }
  .photo-item img {
    width: 100%;
    height: auto;
    display: block;
  }
  .photo-details {
    padding: 8px 10px;
    font-size: 14px;
    color: #555;
    text-align: left;
  }
  .download-link {
    display: inline-block;
    margin-top: 5px;
    padding: 6px 12px;
    background-color: #0073e6;
    color: white;
    border-radius: 3px;
    font-size: 14px;
  }
  .download-link:hover {
    background-color: #005bb5;
  }
</style>
</head>
<body>
  <h1>Welcome to Caro and Manu gallery</h1>
  <p><a href="/backoffice">Back Office</a></p>
  <div id="caroManuBox"></div>

  <h2>Public Photo Gallery</h2>

  <div class="gallery" id="photoScroller">
    <!-- Photos will be dynamically loaded here as grid -->
  </div>

  <script>
    async function loadCaroManuText() {
      try {
        const response = await fetch('/api/env?key=CARO_MANU_TEXT');
        if (!response.ok) {
          throw new Error('Failed to fetch text');
        }
        const data = await response.json();
        const box = document.getElementById('caroManuBox');
        box.textContent = data.value || 'Le site de Caro & Manu';
      } catch (err) {
        console.error(err);
      }
    }

    async function loadPhotos() {
      try {
        const response = await fetch('/api/photos');
        if (!response.ok) {
          throw new Error('Failed to fetch photos');
        }
        const data = await response.json();
        const photoScroller = document.getElementById('photoScroller');
        photoScroller.innerHTML = '';
        if (data.photos.length === 0) {
          photoScroller.innerHTML = '<p>No photos available.</p>';
          return;
        }
        data.photos.forEach(photo => {
          const div = document.createElement('div');
          div.className = 'photo-item';

          const img = document.createElement('img');
          img.src = photo.url;
          img.alt = photo.filename;
          img.title = photo.filename;

          const details = document.createElement('div');
          details.className = 'photo-details';
          details.textContent = photo.filename;

          const link = document.createElement('a');
          link.href = photo.url;
          link.download = photo.filename;
          link.className = 'download-link';
          link.textContent = 'Download';

          details.appendChild(link);
          div.appendChild(img);
          div.appendChild(details);

          photoScroller.appendChild(div);
        });
      } catch (err) {
        const photoScroller = document.getElementById('photoScroller');
        photoScroller.innerHTML = '<p>Error loading photos.</p>';
        console.error(err);
      }
    }

    window.onload = () => {
      loadCaroManuText();
      loadPhotos();
    };

    // Online/Offline popup alerts
    window.addEventListener('online', () => {
      alert('You are online');
    });
    window.addEventListener('offline', () => {
      alert('You are offline');
    });
  </script>
</body>
</html>
