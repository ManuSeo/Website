<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Caro & Manu</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 40px;
  }
  #wordmap {
    width: 600px;
    height: 400px;
    margin: 0 auto 20px;
    background: url('https://upload.wikimedia.org/wikipedia/commons/thumb/f/f1/Wordcloud.png/600px-Wordcloud.png') no-repeat center center;
    background-size: contain;
  }
  a {
    margin: 0 10px;
  }
  .photo-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    padding: 10px;
    margin-top: 30px;
  }
  .photo-item {
    background: white;
    border: 1px solid #ccc;
    border-radius: 5px;
    width: 200px;
    padding: 10px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    text-align: center;
  }
  .photo-item img {
    max-width: 100%;
    height: auto;
    border-radius: 3px;
  }
  .download-link {
    display: block;
    margin-top: 10px;
    padding: 5px 10px;
    background-color: #4CAF50;
    color: white;
    text-decoration: none;
    border-radius: 3px;
  }
  .download-link:hover {
    background-color: #45a049;
  }
</style>
</head>
<body>
  <h1>Welcome to the Photo Gallery Website</h1>
  <div id="wordmap"></div>
  <p>This is a public welcome page visible to everyone.</p>
  <p>
    <a href="/login">Login</a> | 
    <a href="/gallery">View Gallery (login required)</a> | 
    <a href="/backoffice">Back Office (login required)</a>
  </p>

  <h2>Public Photo Gallery</h2>
  <div class="photo-container" id="photoContainer">
    <!-- Photos will be dynamically loaded here -->
  </div>

  <script>
    async function loadPhotos() {
      try {
        const response = await fetch('/api/photos');
        if (!response.ok) {
          throw new Error('Failed to fetch photos');
        }
        const data = await response.json();
        const photoContainer = document.getElementById('photoContainer');
        if (data.photos.length === 0) {
          photoContainer.innerHTML = '<p>No photos available.</p>';
          return;
        }
        photoContainer.innerHTML = '';
        data.photos.forEach(photo => {
          const div = document.createElement('div');
          div.className = 'photo-item';

          const img = document.createElement('img');
          img.src = photo.url;
          img.alt = photo.filename;
          img.title = photo.filename;

          const link = document.createElement('a');
          link.href = photo.url;
          link.download = photo.filename;
          link.className = 'download-link';
          link.textContent = 'Download';

          div.appendChild(img);
          div.appendChild(link);
          photoContainer.appendChild(div);
        });
      } catch (err) {
        document.getElementById('photoContainer').innerHTML = '<p>Error loading photos.</p>';
        console.error(err);
      }
    }

    window.onload = loadPhotos;
  </script>
</body>
</html>
